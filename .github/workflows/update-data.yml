name: Actualizar datos (scraper automático)

# Refresca el catálogo, los gráficos y la caché de búsquedas EN LA NUBE, sin que
# tengas el ordenador encendido. Cada pasada hace commit de los JSON generados,
# así que la web/APK siempre tienen datos frescos (GitHub Pages, Vercel, etc.).
#
#   · Se ejecuta solo cada 6 h (cron) y también a mano desde la pestaña Actions.
#   · Si no hay cambios, no crea commit.
#
# El motor es exactamente el mismo que corre dentro del servidor
# (server/updater.mjs), así que lo que ves en local es lo que produce la nube.

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (minuto 0)
  workflow_dispatch:        # botón "Run workflow" para forzarlo ya

permissions:
  contents: write           # necesario para commitear los JSON actualizados

concurrency:
  group: ritmo-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ritmo-music/package-lock.json

      - name: Instalar dependencias
        working-directory: ritmo-music
        run: npm ci

      - name: Actualizar catálogo, gráficos y caché
        working-directory: ritmo-music
        run: node scripts/run-update.mjs --force
        env:
          UPDATE_PAUSE_MS: '900'   # pausa entre consultas (anti-bloqueo de YouTube)

      - name: Publicar los datos actualizados
        run: |
          git config user.name  "ritmo-bot"
          git config user.email "ritmo-bot@users.noreply.github.com"
          git add ritmo-music/server/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "chore(datos): actualización automática del scraper"
            git push
          fi

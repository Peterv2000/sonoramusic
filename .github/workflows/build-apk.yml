name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Los runners de GitHub ya traen el Android SDK instalado en
      # /usr/local/lib/android/sdk (plataformas 34/35 incluidas). Solo hay que
      # exponerlo; setup-android@v3 falla con las cmdline-tools actuales.
      - name: Configurar Android SDK preinstalado
        run: |
          SDK=/usr/local/lib/android/sdk
          CMD="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            CMD=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          if [ -n "$CMD" ] && [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$CMD" --licenses >/dev/null 2>&1 || true
            yes | "$CMD" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build web + sync Capacitor
        env:
          SONORA_APP_URL: https://sonora-music-qrdg.onrender.com
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npm run apk:prepare

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-music-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
